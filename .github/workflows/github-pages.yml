name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build the application for the Pages URL
        run: npm run check
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Record deployed source revision
        run: |
          node -e 'require("node:fs").writeFileSync("dist/deployment.json", JSON.stringify({commit: process.env.GITHUB_SHA, repository: process.env.GITHUB_REPOSITORY}) + "\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
